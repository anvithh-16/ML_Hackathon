name: rforest
family: ensemble-bagging
params: {n_estimators: 300, max_depth: 20, min_samples_leaf: 10, max_features: sqrt, n_jobs: -1}
calibration: none
search_space:
  n_estimators: {type: int, low: 100, high: 600, step: 50}
  max_depth: {type: int, low: 6, high: 30}
  min_samples_leaf: {type: int, low: 1, high: 50, log: true}
  max_features: {type: categorical, choices: [sqrt, log2, 0.5]}
